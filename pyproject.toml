[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-computation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "sci-utils",
    "scipy>=1.17.1",
    "torch>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sci-utils = { path = "../sci-utils", editable = true }
